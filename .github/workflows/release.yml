# Name des Workflows, der in der "Actions"-Übersicht auf GitHub angezeigt wird.
name: Python PyInstaller Release (PySide6)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Executable
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libegl1-mesa libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0

      - name: Remove problematic html package from requirements
        run: |
          grep -v "html~=" requirements.txt > requirements.tmp && mv requirements.tmp requirements.txt
        shell: bash

      - name: Install Python dependencies and latest PyInstaller
        run: |
          python -m pip install --upgrade pip
          # --- WICHTIGE ÄNDERUNG: Installiere die neuste PyInstaller-Version ---
          # Dies stellt die Kompatibilität mit modernen Bibliotheken wie cryptography sicher.
          pip install --upgrade pyinstaller
          pip install -r requirements.txt

      - name: Extract version from meta_info.py
        id: version_step
        run: |
          VERSION=$(python -c "import sys; sys.path.insert(0, 'meta_info'); from meta_info import __version__; print(__version__)")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
        shell: bash

      - name: List files in workspace for debugging
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            dir /s
          else
            ls -R
          fi
        shell: bash

      - name: Build with PyInstaller using spec file
        run: pyinstaller talenttalent.app.spec --noconfirm

      - name: Rename artifact for release
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            mv dist/talenttalent.app dist/talenttalent.exe
          else
            mv dist/talenttalent.app dist/talenttalent
          fi
        shell: bash

      - name: Prepare artifact name
        id: artifact_name
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            echo "ASSET_NAME=talenttalent-windows.exe" >> $GITHUB_ENV
            echo "ASSET_PATH=dist/talenttalent.exe" >> $GITHUB_ENV
          else
            echo "ASSET_NAME=talenttalent-linux" >> $GITHUB_ENV
            echo "ASSET_PATH=dist/talenttalent" >> $GITHUB_ENV
          fi
        shell: bash

      - name: Upload artifact for release
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: ${{ env.ASSET_PATH }}

  create-release:
    name: Create Release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout for manual runs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Get Version
        id: get_version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
          else
            VERSION="v"$(python -c "import sys; sys.path.insert(0, 'meta_info'); from meta_info import __version__; print(__version__)")
            echo "VERSION=$VERSION" >> $GITHUB_ENV
          fi
        shell: bash

      - name: Check if Release Exists
        id: check_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view ${{ env.VERSION }} >/dev/null 2>&1; then
            echo "Release ${{ env.VERSION }} existiert bereits. Erstellung wird übersprungen."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Release ${{ env.VERSION }} existiert nicht. Erstellung wird fortgesetzt."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        if: steps.check_release.outputs.skip == 'false'
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        if: steps.check_release.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          generate_release_notes: true
          files: artifacts/*/*
