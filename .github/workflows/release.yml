# Name des Workflows, der in der "Actions"-Übersicht auf GitHub angezeigt wird.
name: Python PyInstaller Release (PySide6)

on:
  push:
    # Löst nur noch bei neuen Tags aus, nicht bei jedem Branch-Push
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Executable
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libegl1-mesa libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-shape0

      - name: Remove problematic packages from requirements
        run: |
          grep -vE "html~=|pyinstaller|docopt|pip~=" requirements.txt > requirements.tmp && mv requirements.tmp requirements.txt
        shell: bash

      - name: Install Python dependencies and latest PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade pyinstaller
          pip install docopt
          pip install -r requirements.txt

      - name: Extract version from meta_info.py
        id: version_step
        run: |
          VERSION=$(python -c "import sys; sys.path.insert(0, 'meta_info'); from meta_info import __version__; print(__version__)")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
        shell: bash

      - name: List files in workspace for debugging
        run: ls -R
        shell: bash

      - name: Build with PyInstaller using spec file
        run: |
          if [ "${{ runner.os }}" == "Linux" ]; then
            sed -i 's/upx=True,/upx=False,/' talenttalent.app.spec
          fi
          pyinstaller talenttalent.app.spec --noconfirm
        shell: bash

      # --- GEÄNDERT: Fügt das Ausführbar-Bit für Linux hinzu ---
      - name: Rename artifact and set executable bit
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            mv dist/talenttalent.app dist/talenttalent-${{ env.VERSION }}-windows.exe
          else
            mv dist/talenttalent.app dist/talenttalent-${{ env.VERSION }}-linux
            # Setzt das Ausführbar-Bit für die Linux-Datei
            chmod +x dist/talenttalent-${{ env.VERSION }}-linux
          fi
        shell: bash

      - name: Prepare artifact name
        id: artifact_name
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            echo "ASSET_NAME=talenttalent-${{ env.VERSION }}-windows.exe" >> $GITHUB_ENV
            echo "ASSET_PATH=dist/talenttalent-${{ env.VERSION }}-windows.exe" >> $GITHUB_ENV
          else
            echo "ASSET_NAME=talenttalent-${{ env.VERSION }}-linux" >> $GITHUB_ENV
            echo "ASSET_PATH=dist/talenttalent-${{ env.VERSION }}-linux" >> $GITHUB_ENV
          fi
        shell: bash

      - name: Upload artifact for release
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: ${{ env.ASSET_PATH }}

  # Dieser Job läuft nur, wenn ein Tag erstellt wurde.
  create-release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*/*
